<!DOCTYPE html>
{% load static %}
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Chatbot RAG - Hệ Thống Quản Lý Văn Bản</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet"/>
  <style>
    :root {
      --primary: #4361ee;
      --primary-light: #4895ef;
      --success: #27ae60;
      --bg: #f8f9fa;
      --card: #ffffff;
      --text: #2d3436;
      --text-light: #636e72;
      --border: #dfe6e9;
      --shadow: 0 8px 24px rgba(0,0,0,0.08);
      --radius: 16px;
    }

    [data-theme="dark"] {
      --bg: #121212;
      --card: #1e1e1e;
      --text: #e0e0e0;
      --text-light: #b0b0b0;
      --border: #333;
      --shadow: 0 8px 24px rgba(0,0,0,0.3);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      transition: all 0.3s ease;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 1rem;
    }

    header {
      text-align: center;
      padding: 2rem 0;
    }

    h1 {
      font-size: 2.3rem;
      color: var(--primary);
      margin-bottom: 0.5rem;
      font-weight: 700;
    }

    .subtitle {
      color: var(--text-light);
      font-size: 1.05rem;
    }

    .chat-container {
      max-width: 900px;
      margin: 2rem auto;
      background: var(--card);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      height: calc(100vh - 180px);
      min-height: 650px;
    }

    .chat-header {
      padding: 1rem 1.5rem;
      background: var(--primary);
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .chat-header h3 {
      font-size: 1.15rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .header-actions {
      display: flex;
      gap: 0.75rem;
      align-items: center;
    }

    .btn-icon {
      background: rgba(255,255,255,0.2);
      border: none;
      color: white;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.3s;
    }

    .btn-icon:hover {
      background: rgba(255,255,255,0.3);
    }

    .chat-body {
      flex: 1;
      padding: 1.5rem;
      overflow-y: auto;
      background: var(--card);
    }

    .message {
      margin-bottom: 1.2rem;
      display: flex;
      gap: 12px;
      animation: fadeIn 0.4s ease;
    }

    .message.bot { flex-direction: row; }
    .message.user { flex-direction: row-reverse; }

    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      flex-shrink: 0;
    }

    .bot .avatar {
      background: var(--primary);
      color: white;
    }

    .user .avatar {
      background: #e9ecef;
      color: var(--text);
    }

    [data-theme="dark"] .user .avatar {
      background: #333;
    }

    .bubble {
      max-width: 72%;
      padding: 1rem 1.3rem;
      border-radius: 18px;
      font-size: 0.96rem;
      line-height: 1.55;
      word-wrap: break-word;
    }

    .bot .bubble {
      background: #eef1ff;
      color: var(--text);
      border-bottom-left-radius: 4px;
    }

    .user .bubble {
      background: var(--primary);
      color: white;
      border-bottom-right-radius: 4px;
    }

    .chat-footer {
      padding: 1rem 1.5rem;
      background: var(--card);
      border-top: 1px solid var(--border);
    }

    .input-group {
      display: flex;
      gap: 0.8rem;
      align-items: flex-end;
    }

    .input-wrapper {
      flex: 1;
      position: relative;
    }

    textarea {
      width: 100%;
      padding: 0.95rem 1.1rem;
      border: 1.5px solid var(--border);
      border-radius: 14px;
      resize: none;
      font-family: inherit;
      font-size: 0.96rem;
      background: var(--bg);
      color: var(--text);
      max-height: 130px;
      transition: all 0.3s;
    }

    textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(67, 97, 238, 0.15);
    }

    .send-btn {
      background: var(--primary);
      color: white;
      border: none;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s;
      flex-shrink: 0;
    }

    .send-btn:hover {
      background: var(--primary-light);
      transform: scale(1.08);
    }

    .send-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .typing {
      font-style: italic;
      color: var(--text-light);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .typing::after {
      content: '';
      width: 6px;
      height: 6px;
      background: var(--text-light);
      border-radius: 50%;
      animation: blink 1s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 0; }
      50% { opacity: 1; }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 768px) {
      .chat-container { margin: 1rem; height: calc(100vh - 100px); border-radius: 12px; }
      h1 { font-size: 1.9rem; }
      .bubble { max-width: 88%; }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Chatbot RAG</h1>
      <p class="subtitle">Hỏi đáp tài liệu văn bản hệ điều hành</p>
    </header>

    <div class="chat-container">
      <div class="chat-header">
        <h3><i class="fas fa-robot"></i> Chatbot Văn Bản</h3>
        <div class="header-actions">
          <button class="btn-icon" id="clearBtn" title="Xóa lịch sử">
            <i class="fas fa-trash"></i>
          </button>
          <button class="btn-icon" id="themeToggle">
            <i class="fas fa-moon"></i>
          </button>
        </div>
      </div>

      <div class="chat-body" id="chatBody">
        <div class="message bot">
          <div class="avatar"><i class="fas fa-robot"></i></div>
          <div class="bubble">
            Xin chào! Tôi là trợ lý ảo của hệ thống quản lý văn bản.<br>
            Bạn có thể hỏi tôi về nội dung các tài liệu PDF đã được upload vào hệ thống.
          </div>
        </div>
      </div>

      <div class="chat-footer">
        <div class="input-group">
          <div class="input-wrapper">
            <textarea id="userInput" placeholder="Hãy hỏi tôi về tài liệu..." rows="1"></textarea>
          </div>
          <button class="send-btn" id="sendBtn">
            <i class="fas fa-paper-plane"></i>
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Configuration
    const API_BASE = '/api/v1/chatbot';
    
    // Elements
    const chatBody = document.getElementById('chatBody');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const themeToggle = document.getElementById('themeToggle');
    const clearBtn = document.getElementById('clearBtn');

    // Get CSRF token from cookie
    function getCookie(name) {
      let cookieValue = null;
      if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
          const cookie = cookies[i].trim();
          if (cookie.substring(0, name.length + 1) === (name + '=')) {
            cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
            break;
          }
        }
      }
      return cookieValue;
    }
    const csrftoken = getCookie('csrftoken');

    // Check system status on load
    async function checkStatus() {
      try {
        const response = await fetch(`${API_BASE}/bot/status/`, {
          method: 'GET',
          headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': csrftoken,
          },
          credentials: 'same-origin',  // Include session cookie
        });
        
        if (response.status === 403 || response.status === 401) {
          // Not authenticated
          addMessage('bot', '⚠️ Bạn chưa đăng nhập. Đang chuyển đến trang đăng nhập...');
          sendBtn.disabled = true;
          userInput.disabled = true;
          setTimeout(() => {
            window.location.href = '/login/?next=/chatbot/';
          }, 2000);
          return;
        }
        
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }
        
        const data = await response.json();
        if (data.initialized) {
          addMessage('bot', `✓ Hệ thống sẵn sàng! Có ${data.pdf_count} tài liệu PDF trong database.`);
        } else {
          addMessage('bot', '⚠️ Hệ thống chưa có tài liệu PDF. Vui lòng upload tài liệu trước.');
        }
      } catch (error) {
        console.error('Error checking status:', error);
        addMessage('bot', `❌ Không thể kết nối với hệ thống: ${error.message}`);
      }
    }

    // Init
    checkStatus();

    // Auto resize textarea
    userInput.addEventListener('input', function() {
      this.style.height = 'auto';
      this.style.height = this.scrollHeight + 'px';
    });

    // Send message
    sendBtn.addEventListener('click', sendMessage);
    userInput.addEventListener('keypress', e => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    async function sendMessage() {
      const text = userInput.value.trim();
      if (!text) return;

      // Disable input while processing
      sendBtn.disabled = true;
      userInput.disabled = true;

      addMessage('user', text);
      userInput.value = '';
      userInput.style.height = 'auto';

      const typing = addMessage('bot', '<span class="typing">Đang phân tích tài liệu...</span>');

      try {
        const response = await fetch(`${API_BASE}/bot/chat/`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': csrftoken,
          },
          credentials: 'same-origin',  // Include session cookie
          body: JSON.stringify({ message: text })
        });

        // Remove typing indicator
        chatBody.removeChild(typing);

        // Check content type
        const contentType = response.headers.get('content-type');
        
        if (!contentType || !contentType.includes('application/json')) {
          // Response is not JSON - likely HTML error page
          const htmlText = await response.text();
          console.error('Non-JSON response:', htmlText.substring(0, 200));
          
          if (response.status === 403 || response.status === 401) {
            throw new Error('Phiên đăng nhập đã hết hạn. Vui lòng đăng nhập lại.');
          }
          throw new Error(`Server trả về HTML thay vì JSON. Status: ${response.status}`);
        }

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.detail || data.error || `HTTP ${response.status}`);
        }

        const reply = data.bot_message?.content || data.reply || 'Không có phản hồi';
        addMessage('bot', reply);

      } catch (error) {
        // Remove typing indicator if still exists
        try {
          if (typing.parentNode === chatBody) {
            chatBody.removeChild(typing);
          }
        } catch (e) {}
        
        console.error('Chat error:', error);
        addMessage('bot', `❌ Lỗi: ${error.message}`);
        
        // Redirect to login if session expired
        if (error.message.includes('đăng nhập')) {
          setTimeout(() => {
            window.location.href = '/login/?next=/chatbot/';
          }, 2000);
        }
      } finally {
        sendBtn.disabled = false;
        userInput.disabled = false;
        userInput.focus();
      }
    }

    function addMessage(sender, text) {
      const message = document.createElement('div');
      message.className = `message ${sender}`;
      message.innerHTML = `
        <div class="avatar">${sender === 'bot' ? '<i class="fas fa-robot"></i>' : '<i class="fas fa-user"></i>'}</div>
        <div class="bubble">${text}</div>
      `;
      chatBody.appendChild(message);
      chatBody.scrollTop = chatBody.scrollHeight;
      return message;
    }

    // Clear chat
    clearBtn.onclick = () => {
      if (confirm('Xóa lịch sử chat?')) {
        chatBody.innerHTML = `
          <div class="message bot">
            <div class="avatar"><i class="fas fa-robot"></i></div>
            <div class="bubble">Đã xóa lịch sử chat. Bạn có thể bắt đầu hỏi mới.</div>
          </div>
        `;
      }
    };

    // Theme toggle
    themeToggle.addEventListener('click', () => {
      const isDark = document.body.getAttribute('data-theme') === 'dark';
      document.body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      themeToggle.innerHTML = isDark ? '<i class="fas fa-moon"></i>' : '<i class="fas fa-sun"></i>';
      localStorage.setItem('theme', isDark ? 'light' : 'dark');
    });

    // Load saved theme
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.body.setAttribute('data-theme', 'dark');
      themeToggle.innerHTML = '<i class="fas fa-sun"></i>';
    }
  </script>
</body>
</html>
