<!-- Assignment Modal - Multi-step workflow for CHO_PHAN_CONG status -->
<dialog id="modalAssignment" class="p-0 rounded-lg shadow-xl backdrop:bg-slate-900/50 w-full max-w-2xl">
  <div class="p-6">
    <div class="flex items-center justify-between mb-4">
      <h3 class="text-lg font-semibold text-slate-800">Phân công hồ sơ</h3>
      <button type="button" onclick="document.getElementById('modalAssignment').close()" 
              class="text-slate-400 hover:text-slate-600">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>

    <form id="assignment-form" class="space-y-4">
      <!-- Specialist Selection -->
      <div class="space-y-2">
        <label class="text-sm font-medium text-slate-700" for="assignment-assignee">
          Chọn chuyên viên
        </label>
        <div class="flex gap-2">
          <select id="assignment-assignee" 
                  class="flex-1 h-10 rounded-md border border-slate-200 px-3 text-sm focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20">
            <option value="">Chọn chuyên viên</option>
          </select>
          <button type="submit" 
                  class="h-10 rounded-md bg-blue-600 px-4 text-sm font-medium text-white hover:bg-blue-700 shadow-sm whitespace-nowrap">
            Thêm vào danh sách
          </button>
        </div>
      </div>

      <!-- Pending Specialists List -->
      <div class="border-t border-slate-200 pt-4">
        <h4 class="text-sm font-semibold text-slate-700 mb-3">Danh sách chuyên viên đã chọn</h4>
        <div id="pending-specialists-list" class="space-y-3">
          <div class="text-sm text-slate-500 text-center py-3">
            Chưa có chuyên viên nào được chọn. Vui lòng chọn chuyên viên và nhấn "Thêm vào danh sách".
          </div>
        </div>
      </div>

      <!-- Shared Instruction -->
      <div class="border-t border-slate-200 pt-4">
        <label class="text-sm font-medium text-slate-700" for="assignment-instruction">
          Ghi chú/Yêu cầu chung
        </label>
        <textarea id="assignment-instruction" rows="2"
                  class="mt-1 w-full rounded-md border border-slate-200 px-3 py-2 text-sm focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20"
                  placeholder="Ghi rõ yêu cầu hoặc lưu ý chung cho tất cả chuyên viên."></textarea>
      </div>

      <!-- Action Buttons -->
      <div class="flex justify-end gap-3 pt-2 border-t border-slate-200">
        <button type="button" onclick="document.getElementById('modalAssignment').close()" 
                class="px-4 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50 rounded-md border border-slate-200">
          Hủy
        </button>
        <button type="button" id="btnFinalAssign"
                class="px-4 py-2 text-sm font-medium text-white bg-emerald-600 hover:bg-emerald-700 rounded-md shadow-sm">
          Phân công
        </button>
      </div>
    </form>
  </div>
</dialog>
