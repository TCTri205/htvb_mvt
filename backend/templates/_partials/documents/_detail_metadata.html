<article class="card p-5 space-y-4">
  <header class="space-y-2">
    <div class="flex flex-wrap items-center gap-2">
      <span
        id="doc-badge-direction"
        class="px-2.5 py-1 rounded-full bg-blue-50 text-blue-700 text-xs font-semibold"
        >Đang tải</span
      >
      <span
        id="doc-badge-urgency"
        class="px-2.5 py-1 rounded-full bg-rose-100 text-rose-700 text-xs font-semibold"
        >Đang tải</span
      >
      <span
        id="doc-badge-status"
        class="px-2.5 py-1 rounded-full bg-slate-900 text-white text-xs font-semibold"
        >Đang tải</span
      >
    </div>
    <h1 id="doc-title" class="text-[19px] font-semibold text-slate-800">
      Đang tải tiêu đề…
    </h1>
    <p id="doc-summary" class="text-[13px] text-slate-500 leading-relaxed">
      Đang tải mô tả chung…
    </p>
  </header>
  <dl class="grid gap-4 md:grid-cols-3 text-[13px] text-slate-600">
    <div class="flex flex-col gap-1">
      <dt class="font-semibold text-slate-700">Ký hiệu</dt>
      <dd id="doc-meta-code">—</dd>
    </div>
    <div class="flex flex-col gap-1">
      <dt class="font-semibold text-slate-700">Số đến</dt>
      <dd id="doc-meta-number">—</dd>
    </div>
    <div class="flex flex-col gap-1">
      <dt class="font-semibold text-slate-700">Ngày ban hành</dt>
      <dd id="doc-meta-issued">—</dd>
    </div>
    <div class="flex flex-col gap-1">
      <dt class="font-semibold text-slate-700">Ngày đến</dt>
      <dd id="doc-meta-received">—</dd>
    </div>
    <div class="flex flex-col gap-1">
      <dt class="font-semibold text-slate-700">Cơ quan gửi</dt>
      <dd id="doc-meta-sender">—</dd>
    </div>
    <div class="flex flex-col gap-1">
      <dt class="font-semibold text-slate-700">Tiếp nhận</dt>
      <dd id="doc-meta-received-by">—</dd>
    </div>
    <div class="flex flex-col gap-1">
      <dt class="font-semibold text-slate-700">Lĩnh vực</dt>
      <dd id="doc-meta-field">—</dd>
    </div>
    <div class="flex flex-col gap-1">
      <dt class="font-semibold text-slate-700">Hạn xử lý</dt>
      <dd id="doc-meta-deadline" class="text-rose-600 font-medium">—</dd>
    </div>
  </dl>
</article>
