<article class="card doc-card doc-card--summary">
  <header class="space-y-2">
    <div class="flex flex-wrap items-center gap-2">
      <span
        id="doc-badge-direction"
        class="px-2.5 py-1 rounded-full bg-emerald-50 text-emerald-700 text-[12px] font-semibold"
        >Văn bản đi</span
      >
      <span
        id="doc-badge-urgency"
        class="px-2.5 py-1 rounded-full bg-slate-100 text-slate-700 text-[12px] font-semibold"
        >Thường</span
      >
      <span
        id="doc-badge-status"
        class="px-2.5 py-1 rounded-full bg-slate-100 text-slate-700 text-[12px] font-semibold"
        >—</span
      >
    </div>
    <h1 id="doc-title" class="text-[20px] font-semibold text-slate-800">
      Thông tin văn bản đi
    </h1>
    <p id="doc-summary" class="text-sm text-slate-500 leading-relaxed">
      Đang tải dữ liệu văn bản…
    </p>
  </header>
  <dl class="grid gap-4 doc-meta-grid text-sm text-slate-600">
    <div class="flex flex-col gap-1">
      <dt class="font-semibold text-slate-700">Ký hiệu</dt>
      <dd id="doc-meta-code">—</dd>
    </div>
    <div class="flex flex-col gap-1">
      <dt class="font-semibold text-slate-700">Số phát hành nội bộ</dt>
      <dd id="doc-meta-issue">—</dd>
    </div>
    <div class="flex flex-col gap-1">
      <dt class="font-semibold text-slate-700">Ngày soạn</dt>
      <dd id="doc-meta-issued">—</dd>
    </div>
    <div class="flex flex-col gap-1">
      <dt class="font-semibold text-slate-700">Ngày trình ký</dt>
      <dd id="doc-meta-sign-date">—</dd>
    </div>
    <div class="flex flex-col gap-1">
      <dt class="font-semibold text-slate-700">Người ký</dt>
      <dd id="doc-meta-signer">—</dd>
    </div>
    <div class="flex flex-col gap-1">
      <dt class="font-semibold text-slate-700">Phương thức ký</dt>
      <dd id="doc-meta-sign-method">—</dd>
    </div>
    <div class="flex flex-col gap-1">
      <dt class="font-semibold text-slate-700">Đơn vị soạn thảo</dt>
      <dd id="doc-meta-department">—</dd>
    </div>
    <div class="flex flex-col gap-1">
      <dt class="font-semibold text-slate-700">Đơn vị phát hành</dt>
      <dd id="doc-meta-publisher">—</dd>
    </div>
    <div class="flex flex-col gap-1">
      <dt class="font-semibold text-slate-700">Nơi nhận chính</dt>
      <dd id="doc-meta-recipients">—</dd>
    </div>
  </dl>
</article>
