<!-- Partial: Password modal reused across taikhoan pages -->
<div
  id="pwdModal"
  class="fixed inset-0 z-[60] hidden"
  role="dialog"
  aria-modal="true"
  aria-labelledby="pwdTitle"
>
  <div class="absolute inset-0 bg-slate-900/40"></div>
  <div
    class="relative mx-auto mt-24 w-[92%] max-w-md rounded-xl bg-white border border-slate-200 shadow-lg"
  >
    <form
      id="pwdForm"
      class="flex flex-col"
    >
      <header
        class="px-4 py-3 border-b border-slate-100 flex items-center justify-between"
      >
        <h3 id="pwdTitle" class="text-[15px] font-semibold">Đổi mật khẩu</h3>
        <button
          id="pwdClose"
          type="button"
          class="grid place-items-center w-9 h-9 rounded-full hover:bg-slate-100"
          aria-label="Đóng"
          data-close-modal="true"
        >
          ✕
        </button>
      </header>
      <div class="p-4 space-y-3">
        <label class="block">
          <span class="text-[13px] text-slate-500">Mật khẩu hiện tại</span>
          <input
            name="current_password"
            id="curPwd"
            type="password"
            autocomplete="current-password"
            class="mt-1 w-full h-10 rounded-lg border border-slate-200 px-3 focus:outline-none focus:ring-2 focus:ring-blue-600/20"
          />
        </label>
        <label class="block">
          <span class="text-[13px] text-slate-500">Mật khẩu mới</span>
          <input
            name="new_password"
            id="newPwd"
            type="password"
            autocomplete="new-password"
            class="mt-1 w-full h-10 rounded-lg border border-slate-200 px-3 focus:outline-none focus:ring-2 focus:ring-blue-600/20"
          />
        </label>
        <label class="block">
          <span class="text-[13px] text-slate-500">Xác nhận mật khẩu mới</span>
          <input
            name="confirm_password"
            id="cfmPwd"
            type="password"
            autocomplete="new-password"
            class="mt-1 w-full h-10 rounded-lg border border-slate-200 px-3 focus:outline-none focus:ring-2 focus:ring-blue-600/20"
          />
        </label>
        <p class="text-[12.5px] text-slate-500">
          Gợi ý: dùng tối thiểu 8 ký tự, gồm chữ hoa, chữ thường, số và ký hiệu.
        </p>
      </div>
      <div class="p-4 border-t border-slate-100 flex items-center justify-between gap-2">
        <button
          id="pwdCancel"
          type="button"
          class="h-10 rounded-md border border-slate-200 px-3 text-sm font-medium text-slate-700 hover:bg-slate-50"
          data-close-modal="true"
        >
          Hủy
        </button>
        <button
          id="pwdSubmit"
          type="submit"
          class="h-10 rounded-md bg-blue-600 px-4 text-sm font-medium text-white hover:bg-blue-700"
        >
          Lưu mật khẩu
        </button>
      </div>
    </form>
  </div>
</div>
