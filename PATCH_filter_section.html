                <!-- Filters -->
                <section class="mt-6 card p-4 fade-in">
                  <h3 class="text-sm font-semibold text-slate-700 mb-3">
                    Tìm kiếm và lọc
                  </h3>
                  <div class="grid grid-cols-1 md:grid-cols-7 gap-3">
                    <!-- Tìm kiếm - 3 columns -->
                    <div class="md:col-span-3">
                      <input
                        type="text"
                        data-filter="q"
                        class="w-full border border-slate-200 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-600/20 focus:border-blue-500"
                        placeholder="Tìm kiếm công việc…"
                      />
                    </div>
                    
                    <!-- Lọc theo trạng thái - 2 columns -->
                    <div class="md:col-span-2">
                      <select
                        data-filter="status"
                        class="w-full border border-slate-200 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-600/20 focus:border-blue-500"
                      >
                        <option value="">Tất cả trạng thái</option>
                        <option value="MOI_TAO">Mới tạo</option>
                        <option value="CHO_PHAN_CONG">Chờ phân công</option>
                        <option value="DA_PHAN_CONG">Đã phân công</option>
                        <option value="DANG_THUC_HIEN">Đang thực hiện</option>
                        <option value="TAM_DUNG">Tạm dừng</option>
                        <option value="CHO_DUYET_DONG">Chờ duyệt đóng</option>
                        <option value="DONG">Đóng</option>
                      </select>
                    </div>
                    
                    <!-- Lọc theo mức độ - 2 columns -->
                    <div class="md:col-span-2">
                      <select
                        data-filter="priority"
                        class="w-full border border-slate-200 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-600/20 focus:border-blue-500"
                      >
                        <option value="">Tất cả mức độ</option>
                        <option value="URGENT">Khẩn cấp</option>
                        <option value="HIGH">Cao</option>
                        <option value="MEDIUM">Trung bình</option>
                        <option value="LOW">Thấp</option>
                      </select>
                    </div>
                  </div>
                </section>

                <!-- Task table -->
                <section class="mt-6 card p-4 fade-in">
                  <div class="mb-3">
                    <h2 class="font-semibold">Danh sách công việc</h2>
                    <p class="text-sm text-slate-500" data-count="rows">Hiển thị 6 công việc</p>
                  </div>
